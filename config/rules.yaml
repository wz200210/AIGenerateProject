    http_endpoints:
      - path: "/state/v1/health"
        method: "GET"
      - path: "/ApplicationStatus"
        method: "GET"

# ==================== ML 框架 ====================
ml_frameworks:
  - name: "Hugging Face Transformers"
    id: "transformers"
    type: "ml_framework"
    severity: "low"
    description: "HuggingFace 模型库"
    
    process_patterns:
      - "transformers"
      - "huggingface.*transformers"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "from transformers import"
          - "import transformers"

  - name: "PyTorch"
    id: "torch"
    type: "ml_framework"
    severity: "low"
    description: "PyTorch 深度学习框架"
    
    process_patterns:
      - "torchserve"
      - "python.*torch"
      - "\\btorch\\b"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import torch"
          - "from torch import"

  - name: "TensorFlow"
    id: "tensorflow"
    type: "ml_framework"
    severity: "low"
    description: "TensorFlow ML 框架"
    
    process_patterns:
      - "tensorflow.*serving"
      - "tf_serving"
      - "python.*tensorflow"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import tensorflow"
          - "tf\\."

  - name: "ONNX Runtime"
    id: "onnx"
    type: "ml_framework"
    severity: "low"
    description: "ONNX 推理运行时"
    
    process_patterns:
      - "onnxruntime.*server"
      - "onnxruntime"

# ==================== Agent/RAG 框架 ====================
agent_frameworks:
  - name: "LangChain"
    id: "langchain"
    type: "llm_framework"
    severity: "low"
    description: "LLM 应用开发框架"
    
    process_patterns:
      - "langchain-(serve|cli)"
      - "python.*langchain"
      - "\\blangchain\\b"
      - "mock_langchain"
    
    version_probe:
      methods:
        - type: "cli_arg"
          patterns:
            - "version[=\\s]*([\\d.]+)"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import langchain"
          - "from langchain import"

  - name: "LlamaIndex"
    id: "llamaindex"
    type: "rag_tool"
    severity: "low"
    description: "RAG 数据框架"
    
    process_patterns:
      - "llamaindex"
      - "llama_index"
      - "llamaindex_service"
    
    semantic_analyzers:
