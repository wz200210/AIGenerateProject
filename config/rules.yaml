    default_ports:
      - 8000
      - 8080
    
    http_endpoints:
      - path: "/v1/table"
        method: "GET"

  - name: "Vespa"
    id: "vespa"
    type: "vector_database"
    severity: "low"
    description: "Vespa 大规模向量+文本搜索引擎"
    
    process_patterns:
      - "\\bvespa\\b"
