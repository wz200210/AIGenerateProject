    process_patterns:
      - "tritonserver"
    
    default_ports:
      - 8000
      - 8001
      - 8002

  - name: "BentoML"
    id: "bentoml"
    type: "deployment"
    severity: "low"
    description: "模型服务框架"
    
    process_patterns:
      - "bentoml.*serve"
    
    default_ports:
      - 3000

  - name: "Ray Serve"
    id: "ray-serve"
    type: "deployment"
    severity: "low"
    description: "Ray 模型服务"
    
    process_patterns:
      - "ray.*serve"
    
    default_ports:
      - 8265
      - 8000

