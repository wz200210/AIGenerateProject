      - "PINECONE_ENVIRONMENT"

  - name: "FAISS"
    id: "faiss"
    type: "vector_database"
    severity: "low"
    description: "Facebook 相似度搜索库"
    
    process_patterns:
      - "faiss.*server"
      - "faiss-cpu"
      - "faiss-gpu"

  - name: "pgvector"
    id: "pgvector"
    type: "vector_database"
    severity: "low"
    description: "PostgreSQL 向量扩展"
    
    process_patterns:
      - "pgvector"
      - "postgres.*vector"
    
    default_ports:
      - 5432

  - name: "Redis Vector"
    id: "redis-vector"
    type: "vector_database"
