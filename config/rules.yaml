    default_ports:
      - 6379
    
    env_indicators:
      - "REDIS_URL"

  - name: "Elasticsearch"
    id: "elasticsearch"
    type: "vector_database"
    severity: "low"
    description: "Elasticsearch 向量搜索"
    
    process_patterns:
      - "elasticsearch.*vector"
