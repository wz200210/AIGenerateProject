# AI Component Detection Rules
# 运行时 AI 组件检测规则配置文件

# ==================== LLM 推理服务 ====================
llm_services:
  - name: "Ollama"
    id: "ollama"
    type: "llm_framework"
    severity: "medium"
    description: "本地 LLM 推理服务"
    
    # 进程匹配规则
    process_patterns:
      - "\\bollama\\b"
      - "ollama\\.serve"
    
    # 端口检测
    default_ports:
      - 11434
    
    # 版本探测配置
    version_probe:
      methods:
        - type: "cli_arg"
          patterns:
            - "--version[=\\s]*([\\d.]+)"
        - type: "http_api"
          endpoint: "/api/version"
          json_path: "version"
    
    # HTTP 健康/版本端点
    http_endpoints:
      - path: "/api/tags"
        method: "GET"
    
    # 环境变量检测
    env_indicators:
      - "OLLAMA_HOST"
      - "OLLAMA_MODELS"

  - name: "vLLM"
    id: "vllm"
    type: "deployment"
    severity: "medium"
    description: "高性能 LLM 推理引擎"
    
    process_patterns:
      - "\\bvllm\\b"
      - "vllm\\.entrypoints"
      - "python.*vllm"
    
    default_ports:
      - 8000
      - 8080
    
    version_probe:
      methods:
        - type: "exec"
          command: "--version"
          parser: "v?([\\d.]+)"
        - type: "http_api"
          endpoint: "/v1/models"
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"
      - path: "/health"
        method: "GET"

  - name: "Text Generation Inference"
    id: "tgi"
    type: "deployment"
    severity: "medium"
    description: "HuggingFace TGI 推理服务"
    
    process_patterns:
      - "text-generation-inference"
      - "\\btgi\\b"
    
    default_ports:
      - 8080
      - 80
    
    http_endpoints:
      - path: "/info"
        method: "GET"

  - name: "OpenAI API"
    id: "openai"
    type: "llm_framework"
    severity: "medium"
    description: "OpenAI API 服务或代理"
    
    process_patterns:
      - "openai-(api|serve)"
      - "openai.*api"
      - "mock_openai"
    
    default_ports:
      - 8080
      - 3000
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/v1/models"
    
    env_indicators:
      - "OPENAI_API_KEY"
      - "OPENAI_BASE_URL"

  - name: "FastChat"
    id: "fastchat"
    type: "llm_framework"
    severity: "medium"
    description: "多模型对话服务"
    
    process_patterns:
      - "fastchat.*serve"
      - "fastchat.*controller"
    
    default_ports:
      - 8000
      - 21001

  - name: "SGLang"
    id: "sglang"
    type: "deployment"
    severity: "medium"
    description: "SGLang 高性能 LLM 推理引擎"
    
    process_patterns:
      - "sglang"
      - "sglang\\.launch_server"
      - "sglang::scheduler"
      - "python.*sglang"
    
    default_ports:
      - 30000
      - 30001
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/get_model_info"
    
    http_endpoints:
      - path: "/health"
        method: "GET"
      - path: "/get_model_info"
        method: "GET"
    
    env_indicators:
      - "SGLANG_"

  - name: "llama.cpp"
    id: "llama-cpp"
    type: "deployment"
    severity: "medium"
    description: "llama.cpp 本地 LLM 推理服务"
    
    process_patterns:
      - "llama-server"
      - "llama\\.cpp"
      - "llama_cpp"
    
    default_ports:
      - 8080
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/health"
    
    http_endpoints:
      - path: "/health"
        method: "GET"
      - path: "/v1/models"
        method: "GET"

  - name: "LM Studio"
    id: "lm-studio"
    type: "deployment"
    severity: "low"
    description: "LM Studio 本地 LLM 运行时"
    
    process_patterns:
      - "lm[\\s-]studio"
      - "lmserver"
      - "lmstudio"
    
    default_ports:
      - 1234
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/v1/models"
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"

  - name: "LocalAI"
    id: "localai"
    type: "deployment"
    severity: "medium"
    description: "LocalAI 本地 OpenAI 兼容推理服务"
    
    process_patterns:
      - "localai"
      - "local-ai"
    
    default_ports:
      - 8080
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/version"
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"
      - path: "/version"
        method: "GET"
    
    env_indicators:
      - "LOCALAI_MODELS_PATH"

  - name: "KTransformers"
    id: "ktransformers"
    type: "deployment"
    severity: "low"
    description: "KTransformers 异构模型推理框架"
    
    process_patterns:
      - "ktransformers"
      - "ktransformers\\.server"
    
    default_ports:
      - 10002
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"

  - name: "MLX LM Server"
    id: "mlx-lm"
    type: "deployment"
    severity: "low"
    description: "Apple MLX 本地推理服务"
    
    process_patterns:
      - "mlx_lm\\.server"
      - "mlx-lm"
      - "mlx_lm"
    
    default_ports:
      - 8080
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"

  - name: "Xinference"
    id: "xinference"
    type: "deployment"
    severity: "medium"
    description: "Xorbits Inference 模型推理平台(支持 LLM/Embedding/多模态)"
    
    process_patterns:
      - "xinference"
      - "xinference-supervisor"
      - "xinference-worker"
      - "python.*xinference"
    
    default_ports:
      - 9997
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/v1/models"
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"
      - path: "/health"
        method: "GET"
    
    env_indicators:
      - "XINFERENCE_"

  - name: "TabbyAPI"
    id: "tabbyapi"
    type: "deployment"
    severity: "low"
    description: "TabbyAPI ExLlamaV2 高速推理服务"
    
    process_patterns:
      - "tabbyapi"
      - "tabby_api"
      - "exllamav2"
      - "exllama.*server"
    
    default_ports:
      - 5000
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/v1/model"
    
    http_endpoints:
      - path: "/v1/model"
        method: "GET"
      - path: "/health"
        method: "GET"

  - name: "OpenAI Codex CLI"
    id: "codex-cli"
    type: "llm_framework"
    severity: "low"
    description: "OpenAI Codex 终端 AI 编码代理"
    
    process_patterns:
      - "\\bcodex\\b"
      - "codex.*exec"
      - "codex.*tui"
      - "@openai/codex"
    
    env_indicators:
      - "CODEX_HOME"
      - "OPENAI_CODEX"

  - name: "OmniRoute"
    id: "omniroute"
    type: "llm_framework"
    severity: "low"
    description: "OmniRoute 开源 AI 网关(统一 359+ 提供商)"
    
    process_patterns:
      - "omniroute"
      - "omni-route"
    
    default_ports:
      - 20128
