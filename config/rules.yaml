    http_endpoints:
      - path: "/v1/meta"
        method: "GET"

  - name: "Qdrant"
    id: "qdrant"
    type: "vector_database"
    severity: "low"
    description: "Rust 向量数据库"
    
    process_patterns:
      - "\\bqdrant\\b"
