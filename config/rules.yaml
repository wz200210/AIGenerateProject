      - "vespa.*configserver"
    
    default_ports:
      - 8080
      - 19071
    
    http_endpoints:
      - path: "/state/v1/health"
        method: "GET"
      - path: "/ApplicationStatus"
        method: "GET"

  - name: "Marqo"
    id: "marqo"
    type: "vector_database"
    severity: "low"
    description: "Marqo 多模态向量搜索引擎"
    
    process_patterns:
      - "\\bmarqo\\b"
      - "marqo.*search"
      - "python.*marqo"
    
    default_ports:
      - 8882
    
    http_endpoints:
      - path: "/health"
        method: "GET"
      - path: "/api/v2/health"
        method: "GET"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import marqo"
          - "from marqo import"

  - name: "Vald"
    id: "vald"
    type: "vector_database"
    severity: "low"
    description: "Vald 云原生分布式向量搜索引擎"
    
    process_patterns:
      - "vald.*agent"
      - "vald.*gateway"
      - "vdaas/vald"
    
    default_ports:
      - 8081
      - 8082

# ==================== ML 框架 ====================
ml_frameworks:
  - name: "Hugging Face Transformers"
    id: "transformers"
    type: "ml_framework"
    severity: "low"
    description: "HuggingFace 模型库"
    
    process_patterns:
      - "transformers"
      - "huggingface.*transformers"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "from transformers import"
          - "import transformers"

  - name: "PyTorch"
    id: "torch"
    type: "ml_framework"
    severity: "low"
    description: "PyTorch 深度学习框架"
    
    process_patterns:
      - "torchserve"
      - "python.*torch"
      - "\\btorch\\b"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import torch"
          - "from torch import"

  - name: "TensorFlow"
    id: "tensorflow"
    type: "ml_framework"
    severity: "low"
    description: "TensorFlow ML 框架"
    
    process_patterns:
      - "tensorflow.*serving"
      - "tf_serving"
      - "python.*tensorflow"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import tensorflow"
          - "tf\\."

  - name: "ONNX Runtime"
    id: "onnx"
    type: "ml_framework"
    severity: "low"
    description: "ONNX 推理运行时"
    
    process_patterns:
      - "onnxruntime.*server"
      - "onnxruntime"

  # ========== 2026 新兴: LLM 微调框架 ==========
  - name: "Unsloth"
    id: "unsloth"
    type: "ml_framework"
    severity: "low"
    description: "Unsloth 高效 LLM 微调框架(2-5x 提速降显存)"
    
    process_patterns:
      - "unsloth"
      - "python.*unsloth"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import unsloth"
          - "from unsloth import"

  - name: "LLaMA-Factory"
    id: "llama-factory"
    type: "ml_framework"
    severity: "low"
    description: "LLaMA-Factory 统一微调框架(100+ 模型,WebUI)"
    
    process_patterns:
      - "llama[-_]factory"
      - "llamafactory"
      - "train_web"
      - "python.*llamafactory"
    
    default_ports:
      - 7860
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "from llamafactory import"
          - "import llamafactory"

  - name: "Axolotl"
    id: "axolotl"
    type: "ml_framework"
    severity: "low"
    description: "Axolotl YAML 驱动 LLM 微调工具"
    
    process_patterns:
      - "axolotl"
      - "axolotl.*train"
      - "python.*axolotl"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import axolotl"
          - "from axolotl import"

  - name: "TRL"
    id: "trl"
    type: "ml_framework"
    severity: "low"
    description: "HuggingFace TRL 强化学习微调库"
    
    process_patterns:
      - "\\btrl\\b"
      - "python.*trl"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import trl"
          - "from trl import"

  - name: "ms-swift"
    id: "ms-swift"
    type: "ml_framework"
    severity: "low"
    description: "ModelScope Swift 多模态微调/部署框架"
    
    process_patterns:
      - "ms[-_]swift"
      - "swift.*sft"
      - "modelscope.*swift"
    
    semantic_analyzers:
      - type: "python_import"
        patterns:
          - "import swift"
          - "from swift import"

