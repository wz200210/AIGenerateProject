# ==================== 向量数据库 ====================
vector_databases:
  - name: "Milvus"
    id: "milvus"
    type: "vector_database"
    severity: "medium"
    description: "分布式向量数据库"
    
    process_patterns:
      - "milvus.*server"
      - "milvus-standalone"
    
    default_ports:
      - 19530
      - 9091
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/v1/health"
    
    http_endpoints:
      - path: "/v1/health"
        method: "GET"

  - name: "Chroma"
    id: "chroma"
    type: "vector_database"
    severity: "low"
    description: "轻量级向量数据库"
    
    process_patterns:
      - "chromadb"
      - "chroma.*server"
      - "python.*chroma"
      - "mock_chroma"
    
    default_ports:
      - 8000
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/openapi.json"
          json_path: "info.version"
        - type: "cli_arg"
          patterns:
            - "version[=\\s]*([\\d.]+)"
    
    http_endpoints:
      - path: "/api/v1/heartbeat"
        method: "GET"
      - path: "/"
        method: "GET"

  - name: "Weaviate"
    id: "weaviate"
    type: "vector_database"
    severity: "medium"
    description: "向量搜索引擎"
    
    process_patterns:
