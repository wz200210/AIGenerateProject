# AI Component Detection Rules
# 运行时 AI 组件检测规则配置文件

# ==================== LLM 推理服务 ====================
llm_services:
  - name: "Ollama"
    id: "ollama"
    type: "llm_framework"
    severity: "medium"
    description: "本地 LLM 推理服务"
    
    # 进程匹配规则
    process_patterns:
      - "\\bollama\\b"
      - "ollama\\.serve"
    
    # 端口检测
    default_ports:
      - 11434
    
    # 版本探测配置
    version_probe:
      methods:
        - type: "cli_arg"
          patterns:
            - "--version[=\\s]*([\\d.]+)"
        - type: "http_api"
          endpoint: "/api/version"
          json_path: "version"
    
    # HTTP 健康/版本端点
    http_endpoints:
      - path: "/api/tags"
        method: "GET"
    
    # 环境变量检测
    env_indicators:
      - "OLLAMA_HOST"
      - "OLLAMA_MODELS"

  - name: "vLLM"
    id: "vllm"
    type: "deployment"
    severity: "medium"
    description: "高性能 LLM 推理引擎"
    
    process_patterns:
      - "\\bvllm\\b"
      - "vllm\\.entrypoints"
      - "python.*vllm"
    
    default_ports:
      - 8000
      - 8080
    
    version_probe:
      methods:
        - type: "exec"
          command: "--version"
          parser: "v?([\\d.]+)"
        - type: "http_api"
          endpoint: "/v1/models"
    
    http_endpoints:
      - path: "/v1/models"
        method: "GET"
      - path: "/health"
        method: "GET"

  - name: "Text Generation Inference"
    id: "tgi"
    type: "deployment"
    severity: "medium"
    description: "HuggingFace TGI 推理服务"
    
    process_patterns:
      - "text-generation-inference"
      - "\\btgi\\b"
    
    default_ports:
      - 8080
      - 80
    
    http_endpoints:
      - path: "/info"
        method: "GET"

  - name: "OpenAI API"
    id: "openai"
    type: "llm_framework"
    severity: "medium"
    description: "OpenAI API 服务或代理"
    
    process_patterns:
      - "openai-(api|serve)"
      - "openai.*api"
      - "mock_openai"
    
    default_ports:
      - 8080
      - 3000
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/v1/models"
    
    env_indicators:
      - "OPENAI_API_KEY"
      - "OPENAI_BASE_URL"

  - name: "FastChat"
    id: "fastchat"
    type: "llm_framework"
    severity: "medium"
    description: "多模型对话服务"
    
    process_patterns:
      - "fastchat.*serve"
      - "fastchat.*controller"
    
    default_ports:
      - 8000
      - 21001

  - name: "SGLang"
    id: "sglang"
    type: "deployment"
    severity: "medium"
    description: "SGLang 高性能 LLM 推理引擎"
    
    process_patterns:
      - "sglang"
      - "sglang\\.launch_server"
      - "sglang::scheduler"
      - "python.*sglang"
    
    default_ports:
      - 30000
      - 30001
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/get_model_info"
    
    http_endpoints:
      - path: "/health"
        method: "GET"
      - path: "/get_model_info"
        method: "GET"
    
    env_indicators:
      - "SGLANG_"

  - name: "llama.cpp"
    id: "llama-cpp"
    type: "deployment"
    severity: "medium"
    description: "llama.cpp 本地 LLM 推理服务"
    
    process_patterns:
      - "llama-server"
      - "llama\\.cpp"
      - "llama_cpp"
    
    default_ports:
      - 8080
    
    version_probe:
      methods:
        - type: "http_api"
          endpoint: "/health"
    
    http_endpoints:
      - path: "/health"
        method: "GET"
      - path: "/v1/models"
        method: "GET"

  - name: "LM Studio"
    id: "lm-studio"
    type: "deployment"
    severity: "low"
    description: "LM Studio 本地 LLM 运行时"
    
    process_patterns:
      - "lm[\\s-]studio"
      - "lmserver"
      - "lmstudio"
    
    default_ports:
      - 1234
    
    version_probe:
      methods:
        - type: "http_api"
